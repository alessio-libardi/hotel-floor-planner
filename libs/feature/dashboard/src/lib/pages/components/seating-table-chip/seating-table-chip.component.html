@if (tableNumber(); as number) {
  <mat-chip-set [attr.aria-label]="'Table ' + number">
    <mat-chip
      class="print:border-black/30! print:bg-white! print:text-black!"
      [class.bg-[#fef3c7]!]="departureStatus() === 'tomorrow'"
      [class.text-[#78350f]!]="departureStatus() === 'tomorrow'"
      [class.bg-(--mat-sys-error-container)!]="departureStatus() === 'expired'"
      [class.text-(--mat-sys-on-error-container)!]="
        departureStatus() === 'expired'
      "
      [disableRipple]="true"
    >
      <mat-icon matChipAvatar aria-hidden="true">table_restaurant</mat-icon>
      {{ number }}
    </mat-chip>
  </mat-chip-set>
} @else {
  <span class="text-xs font-medium opacity-70 print:text-black!">
    No table
  </span>
}
