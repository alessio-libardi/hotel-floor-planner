@if (tableNumber(); as number) {
  <mat-chip-set [attr.aria-label]="'Table ' + number">
    <mat-chip
      class="w-18! print:border-black/30! print:bg-white! print:text-black!"
      [ngClass]="{
        '[--mat-chip-elevated-container-color:#fef3c7] [--mat-chip-label-text-color:#78350f] [--mat-chip-outline-color:#f59e0b] text-[#78350f]! dark:[--mat-chip-elevated-container-color:#78350f] dark:[--mat-chip-label-text-color:#fef3c7] dark:[--mat-chip-outline-color:#f59e0b] dark:text-[#fef3c7]!':
          departureStatus() === 'tomorrow',
        '[--mat-chip-elevated-container-color:var(--mat-sys-error-container)] [--mat-chip-label-text-color:var(--mat-sys-on-error-container)] [--mat-chip-outline-color:var(--mat-sys-error)] text-(--mat-sys-on-error-container)!':
          departureStatus() === 'expired',
      }"
      [disableRipple]="true"
    >
      <mat-icon matChipAvatar aria-hidden="true">table_restaurant</mat-icon>
      {{ number }}
    </mat-chip>
  </mat-chip-set>
} @else {
  <span
    class="inline-flex w-18 items-center justify-center text-center text-xs font-medium opacity-70 print:text-black!"
  >
    No table
  </span>
}
