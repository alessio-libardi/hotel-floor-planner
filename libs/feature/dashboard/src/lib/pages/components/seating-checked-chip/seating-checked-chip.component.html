<mat-chip-set aria-label="Checked today">
  <mat-chip
    class="bg-green-100! text-green-700! print:border-black/30! print:bg-white! print:text-black!"
    title="Checked today"
    [disableRipple]="true"
    [attr.aria-label]="'Checked today'"
  >
    <mat-icon aria-hidden="true">check</mat-icon>
  </mat-chip>
</mat-chip-set>
