@if (vm$ | async; as vm) {
  <section
    class="grid gap-4 print:bg-white print:text-black print:[color-scheme:light] print:[print-color-adjust:exact] print:[--mat-sys-on-surface:#000] print:[--mat-sys-on-surface-variant:#000] print:[--mat-sys-outline:#0000004d] print:[--mat-sys-surface:#fff] print:[--mat-sys-surface-container:#fff]"
  >
    <div class="grid w-full grid-cols-1 gap-4 sm:grid-cols-3 print:grid-cols-3">
      @for (floor of vm.floors; track floor.id) {
        <lib-seating-floor-column
          [floor]="floor"
          (roomSelected)="openRoomDetails($event)"
          (roomCheckedChange)="handleRoomCheckedChange($event)"
        />
      }
    </div>

    <button
      mat-fab
      type="button"
      class="fixed! right-6 bottom-6 z-20 print:hidden!"
      aria-label="Print seating page"
      (click)="printPage()"
    >
      <mat-icon aria-hidden="true">print</mat-icon>
    </button>
  </section>
}
